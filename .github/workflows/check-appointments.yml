name: Check Crossover Acupuncture Appointments

on:
  schedule:
    - cron: '0 * * * *'   # every hour — script skips runs outside 7am-10pm PT
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Check appointments
        env:
          CROSSOVER_USERNAME:  ${{ secrets.CROSSOVER_USERNAME }}
          CROSSOVER_PASSWORD:  ${{ secrets.CROSSOVER_PASSWORD }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
        run: python check_cloud.py
