name: Check Crossover Acupuncture Appointments

on:
  schedule:
    # Every 15 min during 7am-10pm PT (UTC-7/8).
    # Split into two rules because cron can't span midnight UTC.
    - cron: '*/15 14-23 * * *'   # UTC 14:00-23:59 = ~7am-4pm PT
    - cron: '*/15 0-6 * * *'     # UTC 00:00-06:59 = ~4pm-11pm PT
    # Python script enforces exact hours + weekend 9am start.
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Check appointments
        env:
          CROSSOVER_USERNAME:  ${{ secrets.CROSSOVER_USERNAME }}
          CROSSOVER_PASSWORD:  ${{ secrets.CROSSOVER_PASSWORD }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_PHONE:         ${{ secrets.NOTIFY_PHONE }}
          NOTIFY_PHONE_GATEWAY: ${{ secrets.NOTIFY_PHONE_GATEWAY }}
          NOTIFY_FROM_EMAIL:    ${{ secrets.NOTIFY_FROM_EMAIL }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
        run: python check_cloud.py
